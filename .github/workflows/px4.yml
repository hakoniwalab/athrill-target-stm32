# Boots the stock PX4 v1.17.0 Pixhawk 4 firmware on Athrill STM32 on every
# change: the bench (PX4's own sensor drivers on the emulated chips, EKF2,
# preflight check, two identical runs) and the SIH verification without
# MAVLink (three identical flights in fast and strict mode, and the flight
# log), with the PX4 ELF of the v0.1.1 release, so the regression
# references are compared and every console error or warning must be
# explained by the board's allow-list (examples/console-check.py); and the ArduPilot bench with the
# official ArduCopter Pixhawk4 binary (examples/ardupilot-bench/check.sh).
name: px4

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  px4:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # a check that cannot compare (no reference, no allow-list) fails instead of SKIP
    env:
      REGRESSION_STRICT: 1
    defaults:
      run:
        shell: bash   # -eo pipefail: a failing check before | tee fails the step
    steps:
      - name: athrill-target-stm32
        uses: actions/checkout@v4
        with:
          path: athrill-target-stm32
      # the core and the shared Arm pseudo-code, at the commits the README pins
      - name: "athrill after 3.1.0 (host functions, idle/spin halt, GDB server, block JIT)"
        uses: actions/checkout@v4
        with:
          repository: toppers/athrill
          ref: a63d4cd9b6bcbfea7ad411e590b5b3107b1ce41c
          path: athrill
      - name: athrill-arm-common
        uses: actions/checkout@v4
        with:
          repository: hakoniwalab/athrill-arm-common
          ref: 60d8098cfcbbda5489c74843c15d3d2742e6c3bb
          path: athrill-arm-common
          fetch-depth: 0
      - name: athrill-device
        uses: actions/checkout@v4
        with:
          repository: hakoniwalab/athrill-device
          ref: 40908008e5c820a7e09e1c2acd0ace3c36f9bf67
          path: athrill-device
      - name: libyaml (athrill-device bindings loader)
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then sudo apt-get update -qq && sudo apt-get install -y -qq libyaml-dev pkg-config; else brew install libyaml pkg-config || true; fi
      - name: build athrill3
        working-directory: athrill-target-stm32
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel

      # the released firmware, the one the regression references in
      # athrill-device record (a local build is not bit-identical to it)
      - name: PX4 ELF from the v0.1.1 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p px4-elf
          gh release download v0.1.1 --repo hakoniwalab/athrill-target-stm32 \
            --pattern px4_fmu-v5_default.elf --pattern SHA256SUMS --dir px4-elf
          cd px4-elf
          grep ' px4_fmu-v5_default.elf$' SHA256SUMS | sha256sum -c -
      - name: tools (reading the SD card image, ULog analysis)
        run: |
          sudo apt-get update
          sudo apt-get install -y mtools python3-numpy
          pip3 install --break-system-packages pyulog

      - name: bench (PX4's sensor drivers)
        run: |
          athrill-target-stm32/examples/px4-bench/check.sh px4-elf/px4_fmu-v5_default.elf | tee bench.log
      # exit status 2 = PARTIAL PASS: A and B passed, C (MAVLink) not run here
      - name: SIH verification (determinism and flight log, no MAVLink)
        run: |
          status=0
          athrill-target-stm32/examples/px4-sih/verify/verify.sh px4-elf/px4_fmu-v5_default.elf || status=$?
          test $status = 0 -o $status = 2

      # ArduCopter: the official Pixhawk4 binary (GPL-3.0, not redistributed here), checked by its SHA-256.
      # pymavlink is installed after the SIH step, which runs its MAVLink part only when pymavlink is present.
      - name: ArduCopter V4.7.2 Pixhawk4 from firmware.ardupilot.org
        run: |
          mkdir -p ardupilot-elf
          curl -fsSL -o ardupilot-elf/arducopter.elf https://firmware.ardupilot.org/Copter/stable-4.7.2/Pixhawk4/arducopter.elf
          echo "cfa1b3f04f326ab91760c53b93503b669d4d62e2d43dd1ffc4d09cb15198eb2c  ardupilot-elf/arducopter.elf" | sha256sum -c -
          pip3 install --break-system-packages pymavlink
      - name: ArduPilot bench (boot, sensor health, MAVLink until the end)
        run: |
          athrill-target-stm32/examples/ardupilot-bench/check.sh ardupilot-elf/arducopter.elf athrill-target-stm32/build/athrill3

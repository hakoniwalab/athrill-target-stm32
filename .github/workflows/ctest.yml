# Builds Athrill with this target and runs its CTest tests (decoder, the
# instruction tests against QEMU's output in both modes, the fast executors
# against the pseudo-code, the peripheral and chip models) on Linux and macOS.
name: ctest

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  ctest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        build_type: [Debug, Release]
    runs-on: ${{ matrix.os }}
    steps:
      - name: athrill-target-stm32
        uses: actions/checkout@v4
        with:
          path: athrill-target-stm32
      # the core and the shared Arm pseudo-code, at the commits the README pins
      - name: "athrill (after 3.0.0: host functions, idle/spin halt)"
        uses: actions/checkout@v4
        with:
          repository: toppers/athrill
          ref: 2b9b49f21a9f8ad5e63d396f013ad86d341b29e6
          path: athrill
      - name: athrill-arm-common
        uses: actions/checkout@v4
        with:
          repository: hakoniwalab/athrill-arm-common
          ref: 60d8098cfcbbda5489c74843c15d3d2742e6c3bb
          path: athrill-arm-common
          fetch-depth: 0
      - name: athrill-device
        uses: actions/checkout@v4
        with:
          repository: hakoniwalab/athrill-device
          ref: 3f23a3c9a27d2d97d9bba02ab0a6d2ed016c44bf
          path: athrill-device
      - name: libyaml (athrill-device bindings loader)
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then sudo apt-get update -qq && sudo apt-get install -y -qq libyaml-dev pkg-config; else brew install libyaml pkg-config || true; fi
      - name: build
        working-directory: athrill-target-stm32
        run: |
          cmake -S . -B build-${{ matrix.build_type }} -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          cmake --build build-${{ matrix.build_type }} --parallel
      - name: ctest
        working-directory: athrill-target-stm32/build-${{ matrix.build_type }}
        run: ctest --output-on-failure

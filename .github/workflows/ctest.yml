# Builds Athrill with this target and runs its CTest tests (decoder, the
# instruction tests against QEMU's output in both modes, the fast executors
# against the pseudo-code, the peripheral and chip models) on Linux and macOS.
name: ctest

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  ctest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        build_type: [Debug, Release]
    runs-on: ${{ matrix.os }}
    steps:
      - name: athrill-target-stm32
        uses: actions/checkout@v4
        with:
          path: athrill-target-stm32
      # the commits of the other repositories, from versions.txt
      - name: versions.txt
        id: v
        working-directory: athrill-target-stm32
        run: |
          v() { awk -v k="$1" '$1 == k { print $2 }' versions.txt; }
          echo "athrill=$(v athrill)" >> "$GITHUB_OUTPUT"
          echo "arm_common=$(v athrill-arm-common)" >> "$GITHUB_OUTPUT"
          echo "device=$(v athrill-device)" >> "$GITHUB_OUTPUT"
      # the core and the shared Arm pseudo-code, at the commits of versions.txt
      - name: "athrill after 3.1.0 (host functions, idle/spin halt, GDB server, block JIT)"
        uses: actions/checkout@v4
        with:
          repository: toppers/athrill
          ref: ${{ steps.v.outputs.athrill }}
          path: athrill
      - name: athrill-arm-common
        uses: actions/checkout@v4
        with:
          repository: hakoniwalab/athrill-arm-common
          ref: ${{ steps.v.outputs.arm_common }}
          path: athrill-arm-common
          fetch-depth: 0
      - name: athrill-device
        uses: actions/checkout@v4
        with:
          repository: hakoniwalab/athrill-device
          ref: ${{ steps.v.outputs.device }}
          path: athrill-device
      - name: libyaml (athrill-device bindings loader), gdb-multiarch (GDB remote test, Linux)
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then sudo apt-get update -qq && sudo apt-get install -y -qq libyaml-dev pkg-config gdb-multiarch; else brew install libyaml pkg-config || true; fi
      - name: build
        working-directory: athrill-target-stm32
        run: |
          cmake -S . -B build-${{ matrix.build_type }} -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          cmake --build build-${{ matrix.build_type }} --parallel
      - name: ctest
        working-directory: athrill-target-stm32/build-${{ matrix.build_type }}
        run: ctest --output-on-failure
